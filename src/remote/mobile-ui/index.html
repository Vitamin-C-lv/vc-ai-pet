<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f5eee3">
    <title>李花花</title>
    <link rel="stylesheet" href="/mobile.css">
    <link rel="stylesheet" href="/mobile-redesign.css">
  </head>
  <body>
    <main class="pet-app">
      <header id="app-header" class="app-header">
        <div class="header-brand">
          <span class="paw">🐾</span>
          <h1>李花花</h1>
        </div>
        <button id="connection" type="button" aria-label="同步中" title="连接状态">●</button>
      </header>

      <div class="view-host">
        <section id="play-view" class="app-view play-view" data-view="home" aria-label="和花花玩耍">
          <button id="inner-life-open" class="inner-life-entry" type="button" aria-controls="inner-life-view">
            <span class="home-entry-copy"><span class="vc-icon vc-icon-moon" aria-hidden="true"></span><span>花花的梦境</span></span>
            <span aria-hidden="true">›</span>
          </button>
          <div class="pet-card" aria-live="polite">
            <p class="stage-hint" aria-hidden="true">今天也陪花花玩一会儿吧</p>
            <div class="sprite-wrap"><img id="pet-sprite" src="/assets/idle-front.png" alt="李花花"></div>
            <div class="stage-status">
              <p id="state-label">当前状态：idle</p>
              <div class="emotion"><span>开心 <b id="happiness">—</b></span><span>精力 <b id="energy">—</b></span></div>
            </div>
          </div>
          <div class="interaction" aria-label="和花花互动">
            <button id="pet-button" type="button">摸摸头</button>
            <button id="play-button" type="button">玩耍</button>
            <button id="long-button" type="button">长按</button>
          </div>
          <div class="home-actions" aria-label="主要页面">
            <button id="house-open" class="home-action" type="button" aria-controls="house-view">
              <span class="vc-icon vc-icon-construction" aria-hidden="true"></span><span>花花家</span>
            </button>
            <button id="chat-open" class="home-action" type="button" aria-controls="chat-view">
              <span aria-hidden="true">💬</span><span>聊天</span>
            </button>
          </div>
        </section>

        <section id="house-view" class="app-view house-view" aria-label="花花家" hidden>
          <header class="subpage-header">
            <button id="house-back" class="icon-button" type="button" aria-label="返回">
              <span class="vc-icon vc-icon-back" aria-hidden="true"></span>
            </button>
            <button id="house-home" class="icon-button" type="button" aria-label="回到主页">
              <span class="vc-icon vc-icon-home" aria-hidden="true"></span>
            </button>
            <h2>花花家</h2>
          </header>
          <div class="house-content">
            <span class="house-illustration"><span class="vc-icon vc-icon-construction" aria-hidden="true"></span></span>
            <h3>花花家</h3>
            <p>正在施工中…</p>
            <p class="house-subtext">花花正在慢慢布置自己的小窝。</p>
          </div>
        </section>

        <section id="inner-life-view" class="app-view inner-life-view" aria-label="花花的梦境" hidden>
          <header class="subpage-header">
            <button id="inner-life-back" class="icon-button" type="button" aria-label="返回">
              <span class="vc-icon vc-icon-back" aria-hidden="true"></span>
            </button>
            <button id="inner-life-home" class="icon-button" type="button" aria-label="回到主页">
              <span class="vc-icon vc-icon-home" aria-hidden="true"></span>
            </button>
            <h2>🌙 花花的梦境</h2>
            <button id="inner-life-refresh" type="button">刷新</button>
          </header>
          <div class="inner-life-scroll">
            <div class="inner-life-stats" aria-label="梦境统计">
              <p><b id="dream-recent">—</b><span>近 7 天梦境</span></p>
              <p><b id="dream-total">—</b><span>累计梦境</span></p>
            </div>
            <p id="dream-latest" class="inner-life-latest">最近梦境：—</p>
            <p class="inner-life-note">这里记录花花的回想与梦中联想，是逐渐形成的理解，可能还需要你的纠正。</p>
            <p id="inner-life-status" class="inner-life-status" role="status" aria-live="polite"></p>
            <div id="inner-life-list" class="inner-life-list"></div>
            <button id="inner-life-more" class="inner-life-more" type="button" hidden>更早的心事</button>
          </div>
        </section>

        <section id="visual-gallery-view" class="app-view visual-gallery-view" aria-label="花花的图库" hidden>
          <header class="subpage-header">
            <button id="visual-gallery-back" class="icon-button" type="button" aria-label="返回">
              <span class="vc-icon vc-icon-back" aria-hidden="true"></span>
            </button>
            <button id="visual-gallery-home" class="icon-button" type="button" aria-label="回到主页">
              <span class="vc-icon vc-icon-home" aria-hidden="true"></span>
            </button>
            <h2>🖼️ 花花的图库</h2>
            <button id="visual-gallery-refresh" type="button">刷新</button>
          </header>
          <div class="visual-gallery-scroll">
            <p class="visual-gallery-subtitle">主人和花花一起看过的照片</p>
            <p id="visual-gallery-status" class="inner-life-status" role="status" aria-live="polite"></p>
            <div id="visual-gallery-grid" class="visual-gallery-grid"></div>
            <button id="visual-gallery-more" class="inner-life-more" type="button" hidden>更早的照片</button>
          </div>
        </section>

        <section id="visual-gallery-detail-view" class="app-view visual-gallery-detail-view" aria-label="图库照片详情" hidden>
          <header class="subpage-header">
            <button id="visual-gallery-detail-back" class="icon-button" type="button" aria-label="返回图库">
              <span class="vc-icon vc-icon-back" aria-hidden="true"></span>
            </button>
            <button id="visual-gallery-detail-home" class="icon-button" type="button" aria-label="回到主页">
              <span class="vc-icon vc-icon-home" aria-hidden="true"></span>
            </button>
            <h2>照片详情</h2>
          </header>
          <div class="visual-gallery-detail-scroll">
            <p id="visual-gallery-detail-status" class="inner-life-status" role="status" aria-live="polite"></p>
            <figure class="visual-gallery-hero">
              <img id="visual-gallery-original" alt="花花看过的照片" hidden>
              <figcaption id="visual-gallery-date"></figcaption>
            </figure>
            <section class="visual-gallery-owner" aria-labelledby="visual-gallery-owner-title">
              <h3 id="visual-gallery-owner-title">主人当时说</h3>
              <p id="visual-gallery-owner-text"></p>
              <p id="visual-gallery-owner-provenance" class="visual-gallery-provenance">原话 · RAW</p>
            </section>
            <section class="visual-gallery-events" aria-labelledby="visual-gallery-events-title">
              <h3 id="visual-gallery-events-title">花花留下的视觉经历</h3>
              <div id="visual-gallery-event-list"></div>
            </section>
            <section class="visual-gallery-terms" aria-labelledby="visual-gallery-terms-title">
              <h3 id="visual-gallery-terms-title">检索线索</h3>
              <div id="visual-gallery-term-list"></div>
            </section>
            <details class="visual-gallery-debug">
              <summary>调试信息</summary>
              <div id="visual-gallery-debug-content"></div>
            </details>
          </div>
        </section>

        <section id="chat-view" class="app-view chat-view" data-view="chat" aria-label="和李花花聊天" hidden>
          <div class="chat">
            <header class="chat-header">
              <button id="chat-home" class="icon-button" type="button" aria-label="回到主页">
                <span class="vc-icon vc-icon-home" aria-hidden="true"></span>
              </button>
              <h2>李花花</h2>
              <button id="chat-gallery" class="icon-button" type="button" aria-label="打开花花的图库">
                <span class="vc-icon vc-icon-gallery" aria-hidden="true"></span>
              </button>
            </header>
            <div id="messages" class="messages">
              <article class="message pet-line">
                <div class="message-bubble">
                  <div class="message-label">李花花</div>
                  <p class="message-text">汪，在呀。</p>
                </div>
              </article>
            </div>
            <div class="chat-composer-wrap">
              <div id="emoji-drawer" class="emoji-drawer" data-open="false" hidden aria-label="表情面板">
                <div class="emoji-grid" data-emoji-grid></div>
              </div>
              <div id="image-preview" class="image-preview" hidden>
                <img id="image-thumbnail" alt="待发送图片预览">
                <button id="remove-image" class="remove-image" type="button" aria-label="移除图片">×</button>
              </div>
              <p id="image-status" class="image-status" role="status" aria-live="polite"></p>
              <form id="chat-form">
              <button id="mic-button" class="icon-button composer-icon-button" type="button" aria-label="语音输入（暂未开放）" title="语音输入后续开放">
                <span class="vc-icon vc-icon-mic" aria-hidden="true"></span>
              </button>
              <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
              <textarea id="chat-input" rows="1" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="和花花说句话……" aria-label="聊天内容"></textarea>
              <button id="emoji-button" class="icon-button composer-icon-button" type="button" aria-label="打开表情面板" aria-controls="emoji-drawer" aria-expanded="false">
                <span class="vc-icon vc-icon-smile" aria-hidden="true"></span>
              </button>
              <button id="image-button" class="icon-button composer-icon-button composer-add-button" type="button" aria-label="添加图片" title="给花花看一张图片">
                <span class="vc-icon vc-icon-plus" aria-hidden="true"></span>
              </button>
              <button id="send-button" class="composer-action-button" type="button" aria-label="发送" hidden>发送</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>
    <section id="diagnostics-panel" class="diagnostics-panel" role="dialog" aria-modal="true" aria-labelledby="diagnostics-title" hidden>
      <div class="diagnostics-sheet">
        <div class="diagnostics-heading">
          <h2 id="diagnostics-title">花花诊断</h2>
          <button id="diagnostics-close" type="button" aria-label="关闭诊断">×</button>
        </div>
        <p id="diagnostics-status" class="diagnostics-status" role="status" aria-live="polite"></p>
        <pre id="diagnostics-output" class="diagnostics-output" aria-label="最近诊断记录"></pre>
        <textarea id="diagnostics-copy-fallback" class="diagnostics-copy-fallback" readonly aria-label="可复制的诊断记录" hidden></textarea>
        <div class="diagnostics-actions">
          <button id="diagnostics-copy" type="button">复制诊断</button>
          <button id="diagnostics-clear" class="diagnostics-clear" type="button">清空日志</button>
        </div>
      </div>
    </section>
    <script src="/diagnostics.js"></script>
    <script src="/navigation.js"></script>
    <script src="/emoji-drawer.js"></script>
    <script src="/chat-composer.js"></script>
    <script src="/submission-state.js"></script>
    <script src="/mobile.js"></script>
  </body>
</html>
