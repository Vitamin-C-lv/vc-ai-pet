# Additive bundle row. The host owns one fixed pet sandbox and two exact
# package-private RPC methods; the client occupies only the global shell.overlay.
- insert:
    - id: vc-ai-pet
      name: vc-ai-pet
      config:
        sandboxRoot: /home/vitamin_c/.local/share/vc-ai-pet/sandbox
        assetRoot: /home/vitamin_c/projects/personal/vc-ai-pet/assets/runtime
        tickMs: 10000
        petVisual:
          nightStartHour: 23
          nightEndHour: 6
          inactivitySleepMinutes: 30
          happyDurationMs: 2500
          excitedDurationMs: 1700
          relaxedDurationMs: 3200
          confusedDurationMs: 2000
          thinkingPulseMs: 700
          walkFrameMs: 150
          longPressMs: 700
          interactionBurstWindowMs: 30000
          waitingAfterInteractionMinutes: 30
          idleActionMinMs: 20000
          idleActionMaxMs: 60000
          idleActionDurationMs: 1800
          zzzEnabled: true
          ambientMoveEnabled: true
